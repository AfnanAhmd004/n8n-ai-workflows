name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e ".[dev]"
      - run: python -m n8nkit check     # workflows valid and in sync with src/
      - run: pytest -q
  n8n-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e ".[dev]" && npm install --no-save n8n@2
      - run: N8N_BIN=$PWD/node_modules/.bin/n8n pytest -q -k end_to_end
