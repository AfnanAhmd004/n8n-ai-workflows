[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "Production-minded n8n workflows with LLM steps, guardrails, tests and a validator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["n8nkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
